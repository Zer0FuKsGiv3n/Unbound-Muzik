# This VM has ~6 GB RAM; the template's 8 GB heap would OOM the build.
# -Djava.net.preferIPv4Stack=true is REQUIRED here: the JVM defaults to
# IPv6 sockets, and this sandbox's virtual network misroutes an IPv6
# socket connecting to IPv4 loopback (the Gradle daemon listens on
# 127.0.0.1, so without this the client can never reach it). It must be
# a systemProp: when set only in org.gradle.jvmargs it did not show up
# in the daemon's JVM opts (observed 2026-11-11).
systemProp.java.net.preferIPv4Stack=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# Jetifier OFF: it rewrites old support-library artifacts to AndroidX, but
# every dependency here is already AndroidX — and Jetifier ran out of heap
# transforming the 100–158 MB Flutter debug engine jars on this 6 GB VM.
android.enableJetifier=false
