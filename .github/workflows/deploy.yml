# Deploy Unbound Muzik to GitHub Pages.
# Builds the Vite app from source on every push to main and publishes dist/.
# PWA icons are generated from favicon.svg at build time
# (scripts/generate-icons.py), so no binary icon files are committed.
# NOTE: this file cannot be pushed by the Muse GitHub App (GitHub blocks
# Apps from creating workflow files via the API) — it is added by hand on
# github.com. Do not include .github/workflows/* in a push-files manifest.
# Pages must be enabled in the repo Settings (Source: GitHub Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PWA icons
        run: |
          pip install pillow numpy
          python3 scripts/generate-icons.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
